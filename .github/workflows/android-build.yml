name: Build signed Aura Browser APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [main, 'rewrite/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/aura-browser.keystore
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PYCODE'
          import base64, os, hashlib, subprocess
          from pathlib import Path
          names=('KEYSTORE_BASE64','KEYSTORE_PASSWORD','KEY_ALIAS','KEY_PASSWORD')
          missing=[n for n in names if not os.environ.get(n)]
          if missing: raise SystemExit('Missing Actions secrets: '+', '.join(missing))
          target=Path(os.environ['ANDROID_KEYSTORE_PATH'])
          target.write_bytes(base64.b64decode(''.join(os.environ['KEYSTORE_BASE64'].split()),validate=True))
          target.chmod(0o600)
          cert=subprocess.check_output(['keytool','-exportcert','-keystore',str(target),'-storepass:env','KEYSTORE_PASSWORD','-alias',os.environ['KEY_ALIAS']])
          expected='df2ce371a9273de278738f149ab8393792d6294cfb2e49d495cac02f2eaecdf8'
          if hashlib.sha256(cert).hexdigest()!=expected:
              raise SystemExit('Signing certificate differs from earlier Aura Browser builds; updates would not install over them')
          print('Signing key verified: same certificate as earlier Aura Browser builds')
          PYCODE

      - name: Unit tests (downloader against a local range server)
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/aura-browser.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify APK signature and metadata
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK=app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion|application-label:"
          ls -l "$APK"
          cp "$APK" AuraBrowser-2.8.apk
          cp app/build/outputs/bundle/release/app-release.aab AuraBrowser-2.8.aab

      - uses: actions/upload-artifact@v4
        with:
          name: AuraBrowser-2.8-apk
          path: AuraBrowser-2.8.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: AuraBrowser-2.8-aab
          path: AuraBrowser-2.8.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/aura-browser.keystore"
