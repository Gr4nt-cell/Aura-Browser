name: Build signed Aura Browser APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/aura-browser.keystore
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PYCODE'
          import base64, os
          from pathlib import Path
          names=('KEYSTORE_BASE64','KEYSTORE_PASSWORD','KEY_ALIAS','KEY_PASSWORD')
          missing=[name for name in names if not os.environ.get(name)]
          if missing: raise SystemExit('Missing Actions secrets: '+', '.join(missing))
          target=Path(os.environ['ANDROID_KEYSTORE_PATH'])
          target.write_bytes(base64.b64decode(''.join(os.environ['KEYSTORE_BASE64'].split()),validate=True))
          target.chmod(0o600)
          PYCODE
      - name: Test persistent parallel downloader
        run: |
          mkdir -p "$RUNNER_TEMP/aura-tests"
          javac --add-modules jdk.httpserver -d "$RUNNER_TEMP/aura-tests" app/src/main/java/com/gr4nt/aurabrowser/DownloadCore.java tests/DownloadCoreTest.java
          java --add-modules jdk.httpserver -cp "$RUNNER_TEMP/aura-tests" DownloadCoreTest
      - name: Download bundletool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bundletool-all.jar" \
            https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
      - name: Build, sign APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/aura-browser.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool-all.jar
        run: python3 build.py
      - uses: actions/upload-artifact@v4
        with:
          name: AuraBrowser-1.3-apk
          path: build/AuraBrowser-1.3.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AuraBrowser-1.3-aab
          path: build/AuraBrowser-1.3.aab
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/aura-browser.keystore"
